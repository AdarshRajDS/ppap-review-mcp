# Static UI preview only — this does NOT host the MCP /mcp endpoint for Langdock.
# Use Railway/Render/Fly (or similar) for the Streamable HTTP MCP server.

[build]
  command = "npx vite build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Keep vite/typescript available during install (they live in devDependencies).
  # Do not set NODE_ENV=production here — npm would skip those packages.
  NPM_FLAGS = "--include=dev"
